<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COPA Import Tool</title><style>body{font:16px Arial;margin:18px;background:#f5f7fb;color:#172033}main{max-width:650px;margin:auto;background:white;padding:18px;border-radius:14px}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}button{background:#1456c0;color:white;border:0;border-radius:8px;font-weight:bold}pre{white-space:pre-wrap;background:#eef2f7;padding:12px}</style><main><h2>COL01 – COPA डेटा इम्पोर्ट</h2><p>यह टूल केवल COPA के चुने हुए paths बदलेगा। Electrician/Fitter और अन्य branches को नहीं छुएगा। पहले Firebase Admin ईमेल/पासवर्ड से लॉगिन करें।</p><label>Admin Email</label><input id="email" type="email"><label>Admin Password</label><input id="pass" type="password"><label>COPA-payload.json चुनें</label><input id="file" type="file" accept="application/json"><button id="go">लॉगिन करके COPA इम्पोर्ट करें</button><pre id="status">तैयार।</pre></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script><script>
const cfg={apiKey:"AIzaSyC6NjUUN_cKegCn_U3fexCRAZ_3hH7cH70",authDomain:"iti-kotri-new.firebaseapp.com",databaseURL:"https://iti-kotri-new-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"iti-kotri-new",appId:"1:737773474172:web:dd6621ed4e609e8cf454f9"};
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.database();const $=id=>document.getElementById(id);const say=s=>$('status').textContent=s;
$('go').onclick=async()=>{try{const f=$('file').files[0];if(!f)throw Error('पहले COPA-payload.json चुनें');const d=JSON.parse(await f.text());if(!Array.isArray(d.students)||d.students.length!==24)throw Error('डेटा जाँच विफल: 24 COPA विद्यार्थी अपेक्षित हैं');if(!confirm('केवल COL01/COPA शाखाएँ बदलें? COPA के मौजूदा 2 टेस्ट विद्यार्थी बदलेंगे। अन्य ट्रेड नहीं बदलेंगे।'))return;say('Admin लॉगिन हो रहा है…');const cred=await auth.signInWithEmailAndPassword($('email').value,$('pass').value);if(cred.user.uid!=='AfnZ9TYRoqeI1OMK2GLJCvL9Zev2')throw Error('यह UID अधिकृत Admin UID से मेल नहीं खाता। कोई डेटा नहीं लिखा गया।');const base='portal_data';const updates={};updates[base+'/students/COL01/COPA']=d.students;for(const k of ['records','evaluations','holidays','maxMarksConfig'])if(d[k])updates[base+'/'+k+'/COL01/COPA']=d[k]; say('डेटा लिखा जा रहा है…');await db.ref().update(updates);say('इम्पोर्ट पूरा। 24 COPA विद्यार्थी और attendance/evaluation/holiday/max-marks रिकॉर्ड लिखे गए। अन्य शाखाएँ सुरक्षित रहीं। अब Firebase Data में जाँच करें।');}catch(e){say('रुक गया: '+(e.message||e));}};
</script></html>
